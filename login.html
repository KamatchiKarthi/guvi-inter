<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GUVI Internship | Login</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="login.html">
                <img src="assets/logo.svg" alt="" class="brand-logo">
                GUVI Internship
            </a>
        </div>
    </nav>

    <main class="page-main">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
                    <div class="card app-card">
                        <div class="card-body">
                            <h1 class="h3 mb-1 text-center">Welcome back</h1>
                            <p class="text-muted text-center mb-4">Log in to view your profile</p>

                            <div id="loginAlert" class="alert d-none" role="alert" aria-live="polite"></div>

                            <form id="loginForm" novalidate>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email <span class="text-danger" aria-hidden="true">*</span></label>
                                    <input type="email" id="email" class="form-control" placeholder="Enter your email"
                                        maxlength="255" autocomplete="email" required aria-describedby="emailError">
                                    <div id="emailError" class="invalid-feedback"></div>
                                </div>

                                <div class="mb-4">
                                    <label for="password" class="form-label">Password <span class="text-danger" aria-hidden="true">*</span></label>
                                    <input type="password" id="password" class="form-control" placeholder="Enter your password"
                                        maxlength="72" autocomplete="current-password" required aria-describedby="passwordError">
                                    <div id="passwordError" class="invalid-feedback"></div>
                                </div>

                                <button type="submit" id="loginButton" class="btn btn-success w-100">Login</button>
                            </form>

                            <p class="text-center mt-4 mb-0">
                                New here? <a href="register.html">Create an account</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
