<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GUVI Internship | Register</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="login.html">
                <img src="assets/logo.svg" alt="" class="brand-logo">
                GUVI Internship
            </a>
        </div>
    </nav>

    <main class="page-main">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
                    <div class="card app-card">
                        <div class="card-body">
                            <h1 class="h3 mb-1 text-center">Create an account</h1>
                            <p class="text-muted text-center mb-4">Register to get started</p>

                            <div id="registerAlert" class="alert d-none" role="alert" aria-live="polite"></div>

                            <form id="registerForm" novalidate>
                                <div class="mb-3">
                                    <label for="fullName" class="form-label">Full name <span class="text-danger" aria-hidden="true">*</span></label>
                                    <input type="text" id="fullName" class="form-control" placeholder="Enter your full name"
                                        maxlength="100" autocomplete="name" required aria-describedby="fullNameError">
                                    <div id="fullNameError" class="invalid-feedback"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">Email <span class="text-danger" aria-hidden="true">*</span></label>
                                    <input type="email" id="email" class="form-control" placeholder="Enter your email"
                                        maxlength="255" autocomplete="email" required aria-describedby="emailError">
                                    <div id="emailError" class="invalid-feedback"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">Password <span class="text-danger" aria-hidden="true">*</span></label>
                                    <input type="password" id="password" class="form-control" placeholder="Enter a password"
                                        maxlength="72" autocomplete="new-password" required
                                        aria-describedby="passwordHint passwordError">
                                    <div id="passwordHint" class="form-text">
                                        8-72 characters with an uppercase letter, a lowercase letter and a number.
                                    </div>
                                    <div id="passwordError" class="invalid-feedback"></div>
                                </div>

                                <div class="mb-4">
                                    <label for="confirmPassword" class="form-label">Confirm password <span class="text-danger" aria-hidden="true">*</span></label>
                                    <input type="password" id="confirmPassword" class="form-control"
                                        placeholder="Re-enter your password" maxlength="72" autocomplete="new-password" required
                                        aria-describedby="confirmPasswordError">
                                    <div id="confirmPasswordError" class="invalid-feedback"></div>
                                </div>

                                <button type="submit" id="registerButton" class="btn btn-success w-100">Register</button>
                            </form>

                            <p class="text-center mt-4 mb-0">
                                Already have an account? <a href="login.html">Login</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
